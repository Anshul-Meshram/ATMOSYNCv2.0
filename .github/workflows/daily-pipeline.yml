name: AtmoSync Automated Daily Pipeline

on:
  schedule:
    # Run daily at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install lightgbm reportlab fastapi uvicorn pydantic requests sentence-transformers qdrant-client google-genai flask

      - name: Run Daily Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'mock' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATMOSYNC_REFRESH_TOKEN: ${{ secrets.ATMOSYNC_REFRESH_TOKEN }}
        run: |
          python scripts/run_daily_pipeline.py
