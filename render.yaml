services:
  - type: web
    name: atmosync-dashboard
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn frontend_backend.server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
